
$mainMod = SUPER

bind = , XF86MonBrightnessUp, exec, brightnessctl set 10%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

bind = $mainMod, RETURN, exec, alacritty
bind = $mainMod, Escape, killactive
bind = $mainMod SHIFT, Q, exit
bind = $mainMod, F, fullscreen
bind = $mainMod, Space, togglefloating
bind = $mainMod, R, exec, rofi -show drun -modi window
bind = $mainMod SHIFT, R, exec, rofi -show window -modi window
bind = $mainMod, B, pseudo
bind = ALT, J, togglesplit
bind = $mainMod SHIFT, S, exec, grimblast copy area
bind = $mainMod, S, exec, grimblast copy screen
bind = $mainMod CTRL, S, exec, grimblast save area ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

bind = $mainMod, F1, exec, ~/.config/hypr/gamemode.sh

bind = $mainMod, grave, togglespecialworkspace, magic
bind = $mainMod SHIFT, grave, movetoworkspace, special:magic

bind = $mainMod, G, togglegroup
bind = $mainMod, Tab, changegroupactive, f
bind = $mainMod SHIFT, Tab, changegroupactive, b

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod ALT, 1, workspace, 21
bind = $mainMod ALT, 2, workspace, 22
bind = $mainMod ALT, 3, workspace, 23
bind = $mainMod ALT, 4, workspace, 24
bind = $mainMod ALT, 5, workspace, 25
bind = $mainMod ALT, 6, workspace, 26
bind = $mainMod ALT, 7, workspace, 27
bind = $mainMod ALT, 8, workspace, 28
bind = $mainMod ALT, 9, workspace, 29
bind = $mainMod ALT, 0, workspace, 30

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod ALT SHIFT, 1, movetoworkspace, 21
bind = $mainMod ALT SHIFT, 2, movetoworkspace, 22
bind = $mainMod ALT SHIFT, 3, movetoworkspace, 23
bind = $mainMod ALT SHIFT, 4, movetoworkspace, 24
bind = $mainMod ALT SHIFT, 5, movetoworkspace, 25
bind = $mainMod ALT SHIFT, 6, movetoworkspace, 26
bind = $mainMod ALT SHIFT, 7, movetoworkspace, 27
bind = $mainMod ALT SHIFT, 8, movetoworkspace, 28
bind = $mainMod ALT SHIFT, 9, movetoworkspace, 29
bind = $mainMod ALT SHIFT, 0, movetoworkspace, 30

bind = $mainMod CTRL, 1, movecurrentworkspacetomonitor, 0
bind = $mainMod CTRL, 2, movecurrentworkspacetomonitor, 1
bind = $mainMod CTRL, 3, movecurrentworkspacetomonitor, 2
bind = $mainMod CTRL, 4, movecurrentworkspacetomonitor, 3

bind = ALT, Tab, cyclenext
bind = SHIFT ALT, Tab, cyclenext, prev

bind = $mainMod SHIFT, left, movetoworkspace, e-1
bind = $mainMod SHIFT, right, movetoworkspace, e+1
bind = $mainMod SHIFT, mouse_down, movetoworkspace, e-1
bind = $mainMod SHIFT, mouse_up, movetoworkspace, e+1

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bind = $mainMod, Tab, workspace, e+1
bind = $mainMod SHIFT, Tab, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
#binde = , XF86MonBrightnessUp, exec, brightnessctl s 10%+
#binde = , XF86MonBrightnessDown, exec, brightnessctl s 10%-
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioNext, exec, playerctl next

