#bind = CTRL, Insert, pass, com.obsproject.Studio
#bind = CTRL, Insert, sendshortcut, , F10, com.obsproject.Studio
bind = $mainMod, Insert, sendshortcut, , F10, ^(com.obsproject.Studio)$

