
decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 0.95
    fullscreen_opacity = 1.0

#    drop_shadow = true
#    shadow_range = 20
#    shadow_render_power = 3
#    shadow_offset = 0 2
#    col.shadow = rgba(00000055)

    dim_inactive = false
    dim_strength = 0.05

    blur {
        enabled = true
        size = 5
        passes = 2
        vibrancy = 0.1696
        noise = 0.0117
        contrast = 0.8916
        brightness = 0.8172
        popups = true
    }
}

layerrule = blur, waybar
layerrule = blur, rofi
layerrule = blur, notifications
layerrule = ignorezero, waybar

