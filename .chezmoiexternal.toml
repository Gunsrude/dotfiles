
# oh-my-opencode-slim - clones into ~/.config/opencode/plugins/oh-my-opencode-slim
[".config/opencode/plugins/oh-my-opencode-slim"]
    type = "git-repo"
    url = "https://github.com/alvinunreal/oh-my-opencode-slim.git"
    pull.args = ["--ff-only"]
    refreshPeriod = "168h"

