{{ $snipVersion := "0.15.0" }}

{{ if eq .chezmoi.os "linux" }}
{{ if eq .chezmoi.arch "amd64" }}
[".local/bin/snip"]
    type = "archive-file"
    url = "https://github.com/edouard-claude/snip/releases/download/v{{ $snipVersion }}/snip_{{ $snipVersion }}_linux_amd64.tar.gz"
    path = "snip"
    executable = true
{{ else if eq .chezmoi.arch "arm64" }}
[".local/bin/snip"]
    type = "archive-file"
    url = "https://github.com/edouard-claude/snip/releases/download/v{{ $snipVersion }}/snip_{{ $snipVersion }}_linux_arm64.tar.gz"
    path = "snip"
    executable = true
{{ end }}
{{ end }}
